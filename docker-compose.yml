services:
  backend:
    build: ./backend
    container_name: bharat-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "4000:4000"   # exposed for local debugging; not required once nginx proxies to it
    networks:
      - bharat-net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
        VITE_WHATSAPP_NUMBER: ${VITE_WHATSAPP_NUMBER}
    container_name: bharat-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - bharat-net

networks:
  bharat-net:
    driver: bridge
