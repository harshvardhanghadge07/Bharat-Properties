# Detects known social/search crawlers so we can serve them a lightweight,
# pre-rendered page with correct per-listing OG/meta tags. These bots don't
# execute JS, so the client-side title/meta updates in the React app (useSEO)
# never reach them — this is what makes WhatsApp/Facebook/Twitter link
# previews for individual listings show the right title/photo instead of
# the generic index.html shell.
map $http_user_agent $is_social_bot {
    default 0;
    "~*(facebookexternalhit|Facebot|Twitterbot|WhatsApp|Slackbot|LinkedInBot|TelegramBot|Discordbot|Pinterest|Googlebot|bingbot)" 1;
}

server {
    listen ${NGINX_PORT:-80};
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Bots: hand off to the backend's prerender route for this same path,
        # which returns real per-page (and per-listing) OG tags.
        if ($is_social_bot) {
            proxy_pass ${BACKEND_URL}/prerender$uri;
        }
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Dynamic sitemap — generated from the live property list, not a static file
    location = /sitemap.xml {
        proxy_pass ${BACKEND_URL}/sitemap.xml;
        proxy_set_header Host $host;
    }
}
